   <g id="text_1">
    <text style="font-weight: 700; font-size: 6.3px; font-family: 'Liberation Sans'; text-anchor: middle" x="48.188976" y="134.891448" transform="rotate(-0 48.188976 134.891448)">Question</text>
   </g>
   <g id="text_2">
    <text style="font-size: 5.9px; font-family: 'Liberation Sans'" transform="translate(123.638204 128.067402)">What are the field boundaries,</text>
    <text style="font-size: 5.9px; font-family: 'Liberation Sans'" transform="translate(122.006946 134.75405)">cropping system, facilities, crop</text>
    <text style="font-size: 5.9px; font-family: 'Liberation Sans'" transform="translate(124.291813 141.675314)">condition and realized yields?</text>
   </g>
   <g id="text_3">
    <text style="font-size: 5.9px; font-family: 'Liberation Sans'" transform="translate(263.079628 128.067402)">How do resources, facilities and</text>
    <text style="font-size: 5.9px; font-family: 'Liberation Sans'" transform="translate(259.635042 134.75405)">management relate to yield across</text>
    <text style="font-size: 5.9px; font-family: 'Liberation Sans'" transform="translate(262.417722 141.675314)">comparable seasons and fields?</text>
   </g>
   <g id="text_4">
    <text style="font-size: 5.9px; font-family: 'Liberation Sans'" transform="translate(403.332763 127.832785)">Which feasible option could raise</text>
    <text style="font-size: 5.9px; font-family: 'Liberation Sans'" transform="translate(406.120052 134.75405)">sustained capacity relative to a</text>
    <text style="font-size: 5.9px; font-family: 'Liberation Sans'" transform="translate(419.892865 141.675314)">specified reference?</text>
   </g>
   <g id="text_5">
    <text style="font-weight: 700; font-size: 6.3px; font-family: 'Liberation Sans'" transform="translate(34.358015 202.650995)">Evidence</text>
    <text style="font-weight: 700; font-size: 6.3px; font-family: 'Liberation Sans'" transform="translate(35.586515 209.41888)">required</text>
   </g>
   <g id="text_6">
    <text style="font-size: 5.9px; font-family: 'Liberation Sans'" transform="translate(125.604563 195.238294)">Field boundaries, dated crop</text>
    <text style="font-size: 5.9px; font-family: 'Liberation Sans'" transform="translate(125.773728 202.159559)">labels, facility records, dated</text>
    <text style="font-size: 5.9px; font-family: 'Liberation Sans'" transform="translate(115.114548 209.080824)">management records, crop condition</text>
    <text style="font-size: 5.9px; font-family: 'Liberation Sans'" transform="translate(140.528798 216.002088)">and yield records</text>
   </g>
   <g id="text_7">
    <text style="font-size: 5.9px; font-family: 'Liberation Sans'" transform="translate(260.95148 195.82138)">Matched multi-season records for</text>
    <text style="font-size: 5.9px; font-family: 'Liberation Sans'" transform="translate(261.599558 202.159559)">comparable fields; one high-yield</text>
    <text style="font-size: 5.9px; font-family: 'Liberation Sans'" transform="translate(257.167644 209.66391)">season does not establish sustained</text>
    <text style="font-size: 5.9px; font-family: 'Liberation Sans'" transform="translate(293.90298 216.002088)">capacity</text>
   </g>
   <g id="text_8">
    <text style="font-size: 5.9px; font-family: 'Liberation Sans'" transform="translate(409.399623 195.238294)">A specified reference, water,</text>
    <text style="font-size: 5.9px; font-family: 'Liberation Sans'" transform="translate(411.038255 202.742645)">nutrient and other resource</text>
    <text style="font-size: 5.9px; font-family: 'Liberation Sans'" transform="translate(400.050888 209.080824)">constraints, and validated response</text>
    <text style="font-size: 5.9px; font-family: 'Liberation Sans'" transform="translate(412.19106 216.585174)">estimates or trial evidence</text>
   </g>
   <g id="text_9">
    <text style="font-weight: 700; font-size: 6.3px; font-family: 'Liberation Sans'; text-anchor: middle" x="48.188976" y="270.8373" transform="rotate(-0 48.188976 270.8373)">Output</text>
   </g>
   <g id="text_10">
    <text style="font-size: 5.9px; font-family: 'Liberation Sans'" transform="translate(129.544657 267.356409)">Reported states with their</text>
    <text style="font-size: 5.9px; font-family: 'Liberation Sans'" transform="translate(141.839243 274.86076)">validation status</text>
   </g>
   <g id="text_11">
    <text style="font-size: 5.9px; font-family: 'Liberation Sans'" transform="translate(269.960042 263.895777)">Associations and plausible</text>
    <text style="font-size: 5.9px; font-family: 'Liberation Sans'" transform="translate(265.371409 270.817042)">explanations, with alternatives</text>
    <text style="font-size: 5.9px; font-family: 'Liberation Sans'" transform="translate(294.064769 278.321392)">retained</text>
   </g>
   <g id="text_12">
    <text style="font-size: 5.9px; font-family: 'Liberation Sans'" transform="translate(406.776888 263.895777)">Scenario comparison; benefits</text>
    <text style="font-size: 5.9px; font-family: 'Liberation Sans'" transform="translate(408.740021 270.817042)">quantified only with validated</text>
    <text style="font-size: 5.9px; font-family: 'Liberation Sans'" transform="translate(421.694669 277.738306)">response evidence</text>
   </g>
   <g id="text_13">
    <text style="font-weight: 700; font-size: 7px; font-family: 'Liberation Sans'; text-anchor: start; fill: #222222" x="18.425197" y="30.156613" transform="rotate(-0 18.425197 30.156613)">Quzhou County, Hebei Province</text>
   </g>
   <g id="text_14">
    <text style="font-size: 6px; font-family: 'Liberation Sans'; text-anchor: start; fill: #222222" x="175.748031" y="29.898019" transform="rotate(-0 175.748031 29.898019)">winter wheat–summer maize rotation  ·  question: sustained production capacity (D6) and its improvement potential</text>
   </g>
   <g id="text_15">
    <text style="font-weight: 700; font-size: 6.3px; font-family: 'Liberation Sans'; text-anchor: middle; fill: #222222" x="162.992126" y="75.329928" transform="rotate(-0 162.992126 75.329928)">L1  State description</text>
   </g>
   <g id="text_16">
    <text style="font-style: italic; font-size: 5.8px; font-family: 'Liberation Sans'; text-anchor: middle; fill: #222222" x="162.992126" y="89.09531" transform="rotate(-0 162.992126 89.09531)">D1–D5 evidence</text>
   </g>
   <g id="text_17">
    <text style="font-weight: 700; font-size: 6.3px; font-family: 'Liberation Sans'; text-anchor: middle; fill: #222222" x="304.724409" y="75.329928" transform="rotate(-0 304.724409 75.329928)">L2  Cross-dimensional interpretation</text>
   </g>
   <g id="text_18">
    <text style="font-style: italic; font-size: 5.8px; font-family: 'Liberation Sans'; text-anchor: middle; fill: #222222" x="304.724409" y="89.09531" transform="rotate(-0 304.724409 89.09531)">D1–D3 related to D4–D5</text>
   </g>
   <g id="text_19">
    <text style="font-weight: 700; font-size: 6.3px; font-family: 'Liberation Sans'; text-anchor: middle; fill: #222222" x="446.456693" y="75.948116" transform="rotate(-0 446.456693 75.948116)">L3  Conditional scenarios</text>
   </g>
   <g id="text_20">
    <text style="font-style: italic; font-size: 5.8px; font-family: 'Liberation Sans'; text-anchor: middle; fill: #222222" x="446.456693" y="88.523466" transform="rotate(-0 446.456693 88.523466)">D6 under stated options</text>
   </g>
   <g id="text_21">
    <text style="font-style: italic; font-size: 5.8px; font-family: 'Liberation Sans'; text-anchor: middle; fill: #222222" x="304.724409" y="55.925041" transform="rotate(-0 304.724409 55.925041)">progressively different evidence  →</text>
   </g>
   <g id="text_22">
